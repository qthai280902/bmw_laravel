name: bmw_laravel

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: bmw_laravel_app:local
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-vehicle_ecommerce}
    DB_USERNAME: bmw
    DB_PASSWORD: bmw_password
    CACHE_STORE: ${CACHE_STORE:-database}
    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
    MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BMW Showroom}
    MAIL_SHOWROOM_ADMIN: ${MAIL_SHOWROOM_ADMIN:-advisor@bmw.com}
    AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
    AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-gemini}
    AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-gemini-3.1-flash-lite}
    AI_ASSISTANT_FALLBACK_MODEL: ${AI_ASSISTANT_FALLBACK_MODEL:-gemini-3.5-flash-lite}
    AI_ASSISTANT_TIMEOUT_SECONDS: ${AI_ASSISTANT_TIMEOUT_SECONDS:-20}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    GEMINI_KEY_COOLDOWN_SECONDS: ${GEMINI_KEY_COOLDOWN_SECONDS:-60}
    GEMINI_KEY_ROTATION: ${GEMINI_KEY_ROTATION:-round_robin}
  depends_on:
    mysql:
      condition: service_healthy
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - bmw

services:
  app:
    <<: *app-common
    container_name: bmw_laravel_app
    restart: unless-stopped

  queue:
    <<: *app-common
    container_name: bmw_laravel_queue
    restart: unless-stopped
    command: php artisan queue:work --queue=notifications,default --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app-common
    container_name: bmw_laravel_scheduler
    restart: unless-stopped
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    container_name: bmw_laravel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bmw

  mysql:
    image: mysql:8.4
    container_name: bmw_laravel_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vehicle_ecommerce}
      MYSQL_USER: ${DB_USERNAME:-bmw}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bmw_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - bmw-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bmw

networks:
  bmw:
    driver: bridge

volumes:
  bmw-mysql-data:
    driver: local
